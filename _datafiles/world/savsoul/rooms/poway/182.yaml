title: Poway Library - Archive Vault
description: Behind reinforced steel doors lies one of Poway's greatest treasures - books. 
  The main reading room has been converted into a climate-controlled vault, with precious 
  texts stored under nitrogen to prevent further decay. Armed scribes work at copying 
  stations, transcribing crumbling pages onto whatever materials they can find. The 
  knowledge of the old world lives on here, for those who can afford the steep access fees.
