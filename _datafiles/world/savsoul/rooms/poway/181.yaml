title: Civic Center Plaza
description: The heart of Poway's former government sprawls before you in various states 
  of decay and makeshift repair. The plaza's fountain has long since dried, now serving 
  as a defensive position. Canvas and sheet metal patch the civic center's cracked dome, 
  while the library's reinforced doors hint at treasures within. This is where the 
  remnants of civilization make their last stand.
