idlemessages:
- Council guards patrol the plaza perimeter with salvaged weapons.
- A scribe hurries between buildings, clutching precious documents.
- The tattered flag of old Poway still flies from a bent pole.
- Refugees line up outside the medical center, hoping for treatment. 