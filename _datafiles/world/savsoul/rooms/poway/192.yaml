idlemessages:
- A neon "OPEN" sign sputters and dies, then flickers back to life.
- The wind whistles through a shattered department store window.
- Rats scurry through the rubble of a collapsed storefront.
- 'A faded sign reads: "Grand Opening! Everything Must Go!"' 