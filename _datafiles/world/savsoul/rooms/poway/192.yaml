roomid: 192
zone: poway
title: Poway Road - Central Retail Ruins
description: |
  The heart of Poway's old shopping district is a collection of shell-shocked storefronts. 
  Shattered windows are boarded up with scrap metal, and faded advertisements promise sales that ended centuries ago. 
  Despite the decay, a few hardy merchants operate from within the more intact structures, their neon "OPEN" signs 
  flickering ironically in the dim light. The silence is broken only by the wind whistling through broken signs.
