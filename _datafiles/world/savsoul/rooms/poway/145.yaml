title: Twin Peaks Foothills - Cursed Ground
description: |
  The ground here is cracked and barren, sloping upwards towards the ominous double peaks 
  that loom in the distance. Wisps of sulfurous gas drift down from the heights, carrying 
  a rotten-egg stench and a palpable sense of dread. Locals consider this area cursed, 
  and few dare to venture further. Strange, unsettling rock formations dot the landscape.
