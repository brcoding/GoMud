idlemessages:
- A gust of wind carries a strong smell of sulfur from the peaks above.
- The ground trembles slightly, a reminder of the unstable volcanic activity.
- 'Strange whispers seem to echo from the rocks, though their source is unclear.'
- No birds sing here, and the silence is heavy and oppressive. 