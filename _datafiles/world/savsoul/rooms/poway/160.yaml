    roomid: 12     # Back to crossroads
idlemessages:
- Your radiation detector screams a continuous alarm.
- The obsidian surface cracks and shifts, still cooling after centuries.
- A heat mirage rises from the crater, distorting the hellish view.
- In the distance, glass formations tinkle as thermal stress shatters them. 