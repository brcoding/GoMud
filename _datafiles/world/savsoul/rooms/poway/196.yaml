roomid: 196
zone: poway
title: Old Poway Village - Trading Post
description: The historic boardwalk has been resurrected as the region's primary trading 
  hub. Salvaged wood and metal stalls line the old-west themed street, where merchants 
  hawk everything from rad-away pills to hand-forged weapons. The rhythmic clang of a 
  blacksmith's hammer provides a steady beat to the chaos of bartering. This is where 
  the new economy thrives, built on the bones of tourist nostalgia.
