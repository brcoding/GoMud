roomid: 141
zone: poway
title: Sycamore Creek - Toxic Flow
description: |
  The air here is heavy with the stench of chemicals and decay, emanating from Sycamore Creek.
  Its waters flow a sickly, unnatural green, with oily bubbles rising to the surface and popping softly.
  On the muddy banks, large, reptilian shapes resembling crocodiles bask in the dim light, their scales glistening 
  with toxic slime. The ground is littered with skeletal remains of unfortunate creatures.
