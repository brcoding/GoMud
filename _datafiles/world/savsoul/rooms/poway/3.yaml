title: Bridlewood Ruins
description: The remains of once-elegant stables stretch before you, their wooden frames 
  warped and blackened. What were once paddocks for prize horses now serve as makeshift 
  pens for the shuffling undead. Radioactive horse skeletons lie scattered about, their 
  bones emanating an eerie green glow in the perpetual twilight. The stench of decay 
  and radiation is overwhelming.
mapsymbol: X
maplegend: Ruins
biome: wasteland
