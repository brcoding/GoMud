idlemessages:
- A zombie horse whinnies from beyond the fence, its vocal cords long rotted.
- The geiger counter on a nearby post clicks rapidly, warning of danger.
- Glowing bones rattle as a rad-wind sweeps through the paddocks.
- Something large shifts in the shadows of the collapsed barn. 