idlemessages:
- A guard patrols the steel fence line, rifle at the ready.
- Mushroom farmers tend their crops with radiation-proof gloves.
- The tarp on a nearby mansion flaps, revealing boarded windows beneath.
- Someone peers out from behind a fortified door, then quickly retreats. 