title: Green Valley Estates
description: Tarp-covered mansions line the cracked boulevards, their once-pristine facades 
  now reinforced with welded steel fences and razor wire. Where manicured lawns once grew, 
  mushroom farms now flourish in the perpetual shade, their pale caps glowing faintly in 
  the dim light. The air is thick with the earthy smell of fungi and the metallic tang 
  of fortification.
