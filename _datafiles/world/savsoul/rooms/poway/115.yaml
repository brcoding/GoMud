idlemessages:
- The low hum of air filtration units is a constant sound.
- Inside the Kevlar-patched greenhouses, rows of strange plants grow under artificial lights.
- 'A sign at the community entrance reads: "La Manda Collective - Pure Food, Fair Trade."'
- Children in small respirators play in a designated, decontaminated area. 