title: North Poway Gateway
description: The cracked asphalt of old Espola Road stretches northward, lined with the 
  skeletal remains of palm trees. Rusted street signs still mark the way to what were once 
  affluent estates, though most now show bullet holes and radiation warnings. A makeshift 
  checkpoint of welded rebar and car doors blocks casual passage north.
