idlemessages:
- A radiation detection alarm chirps weakly from a broken pole.
- Dust devils swirl around the abandoned checkpoint booth.
- The distant howl of mutated coyotes echoes from the northern hills.
- A tattered estate sale banner flaps in the radioactive breeze. 