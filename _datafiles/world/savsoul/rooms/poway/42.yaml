roomid: 42
zone: poway
title: Stoneridge Chateaus - Fortified Quarry
description: |
  The remains of luxury chateaus are built into the sturdy rock of an old quarry.
  The quarry's stone walls have been expertly repurposed into high parapets, bristling with crossbow nests.
  This fortified settlement is difficult to assault, and its residents are well-prepared to defend their claim.
  The tang of cut stone and woodsmoke hangs in the air.
mapsymbol: 'F' # Fortified
maplegend: Stoneridge
biome: fort # Repurposed quarry walls as parapets fits 'fort'
