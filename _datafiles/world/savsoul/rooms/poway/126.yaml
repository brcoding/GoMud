title: Rancho Arbolitos - Woodside Canopy
description: Massive pre-war oaks have somehow survived the apocalypse, their gnarled branches 
  spreading a protective canopy over this small community. Rope bridges and wooden platforms 
  connect elaborate treehouses where families have made their homes in the branches. The 
  elevated living keeps residents safe from ground-level threats, and the oak's mutation 
  has made their bark naturally radiation-resistant.
mapsymbol: T
maplegend: Treetown
biome: forest
