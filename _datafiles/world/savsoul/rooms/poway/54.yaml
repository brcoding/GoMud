idlemessages:
- Sand shifts ominously as something moves beneath the surface.
- A ghoul's pale claw briefly emerges from a burrow before retreating.
- The chittering grows louder as shadows lengthen across the knolls.
- Fresh excavations suggest the ghoul colony is expanding. 