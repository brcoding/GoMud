title: The Knolls - Sand Ghoul Territory  
description: The rolling hills that once hosted upscale homes are now riddled with burrows 
  and sinkholes. As dusk approaches, an unnatural chittering echoes from the depths. The 
  "sand ghouls" - radiation-mutated burrowing creatures - have claimed this territory. 
  Scattered bones and torn equipment mark where the unwary met their end. Even hardened 
  scavengers avoid this place after dark.
mapsymbol: !
