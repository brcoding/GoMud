title: South Poway Crossroads
description: The intersection where civilization once ended and rural Poway began now marks 
  the boundary between the struggling city center and the wild southern territories. Rusted 
  road signs point toward places that may no longer exist - Sycamore Creek, Twin Peaks, 
  and the old Scripps-Poway crater. A makeshift watchtower built from stacked cars provides 
  a vantage point over the desolate landscape.
