idlemessages:
- A scout in the watchtower adjusts their binoculars, scanning the horizon.
- Dust clouds in the distance might be travelers, or something worse.
- 'A weathered sign creaks in the wind: "Danger - Radiation Ahead"'
- The acrid smell of the southern wastes drifts on the breeze. 