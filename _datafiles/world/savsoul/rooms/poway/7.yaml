title: Poway Road Junction
description: The main commercial artery of old Poway stretches before you, its four lanes 
  cracked and buckled from years of neglect and seismic activity. Burned-out cars serve 
  as makeshift barriers and trading posts. To the west, the auto row's rusted signs still 
  advertise deals that ended centuries ago. Eastward, the road leads toward what remains 
  of the civic center.
