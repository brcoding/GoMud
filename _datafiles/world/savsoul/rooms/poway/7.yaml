idlemessages:
- A trader pushes a shopping cart full of scavenged electronics down the road.
- The wind carries the distant sound of hammering from the auto row.
- A pack of feral dogs investigates an overturned delivery truck.
- Neon signs flicker sporadically, powered by jury-rigged solar panels. 