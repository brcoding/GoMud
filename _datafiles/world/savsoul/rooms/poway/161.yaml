title: Lake Poway - Pontoon Village
description: The lake has shrunk to half its original size, but its waters remain one of 
  the region's few potable sources. A floating village of lashed-together pontoons and 
  salvaged boats rings the shoreline, home to those who guard this precious resource. 
  Fishing nets dry in the sun alongside water purification rigs. The sound of children 
  playing - a rare thing in these times - drifts across the water.
