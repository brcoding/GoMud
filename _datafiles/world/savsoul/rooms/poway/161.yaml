idlemessages:
- Children splash in the shallows under the watchful eyes of guards.
- A fisherman pulls in a net, revealing a catch of mutant but edible fish.
- Water purifiers hum steadily, producing the village's most valuable commodity.
- Pontoon bridges creak and sway as residents move between floating homes. 